name: clinquery_gpu  # this environment supports all ClinQuery pipelines

channels:
  - conda-forge
  - defaults

dependencies:
  # Core
  - python=3.10
  - pip
  - numpy=1.26.*
  - pandas=2.2.*
  - duckdb=1.1.*
  - requests=2.*
  - rich=13.*
  - typing_extensions=4.*
  - tzdata
  - setuptools
  - wheel
  - psycopg
  - streamlit
  - faiss-cpu=1.9.*
  - pyyaml
  - scipy=1.12.*
  - scikit-learn=1.5.*
  - matplotlib=3.8.*
  - h5py=3.12.*
  - pillow=9.5.*         
  - libjpeg-turbo=2.1.*
  - pyarrow=19.0.1        

  # Notebooks / Dev
  - jupyter
  - ipykernel
  - ipywidgets
  - jupyterlab_widgets
  - notebook
  - black
  - ruff
  - pytest
  - pre-commit

  # HF stack from conda (prevents pip from building Arrow)
  - datasets
  - transformers
  - accelerate
  - sentence-transformers
  - rapidfuzz
  - sqlparse
  - seqeval
  - openai

  # Pip-only (TF)
  - pip:
      - tensorflow==2.19.1
      - tensorboard==2.19.0
      - tensorflow-io-gcs-filesystem==0.37.1
      - tf-keras==2.19.0

# and then install torch via 'pip install --index-url https://download.pytorch.org/whl/cu124 "torch>=2.6,<2.7"' 
# adding conda to path may also be necessary: 'export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:/lib64:$LD_LIBRARY_PATH"'