name: clinquery_gpu  # this environment supports all ClinQuery pipelines

channels:
  - conda-forge

dependencies:
  # Core
  - python=3.10
  - pip
  - numpy=1.26.*
  - pandas=2.2.*
  - duckdb=1.1.*
  - requests=2.*
  - rich=13.*
  - typing_extensions=4.*
  - tzdata
  - setuptools
  - wheel
  - pyarrow
  - optree=0.13.*
  - psycopg
  - streamlit
  - faiss-cpu
  - pyyaml
  - scipy=1.12.* 
  - scikit-learn=1.5.* 
  - matplotlib=3.8.* 
  - h5py=3.12.* 
  - pillow=10.* 
  - tensorflow=2.18.* 
  - tensorboard=2.18.* 
  - cudnn 
  - cuda-toolkit 
  - nccl 
  - cuda-version=12.5   
  - black       
  - ruff       
  - pytest 
  - pre-commit 

  # for notebooks 
  - jupyter
  - ipykernel
  - ipywidgets
  - jupyterlab_widgets
  - notebook 

  - pip:
      - rapidfuzz
      - sentence-transformers
      - openai
      - sqlparse
      - seqeval 
      - tf-keras 
      - transformers  
      - datasets  
      - accelerate 