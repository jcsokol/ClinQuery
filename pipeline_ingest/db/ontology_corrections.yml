# ontology_rules.yml — v1 (2025-08-31)
#
# PURPOSE
#   Human-editable rules for canonicalizing/enriching clinical terms.
#   Consumed by normalize_and_write.py. Empty sections = no-op.
#
# EXECUTION ORDER (add-only unless noted)
#   1) preprocess: drop short/noisy aliases; remove listed aliases/whole sets.
#   2) equivalent_term_sets: if ANY token appears in a set, add ALL from bucket, and merge any sets that now overlap.
#   3) class_mappings: map terms (canonical or alias) → classes.
#   4) new_classes: attach new class labels to listed terms.
#   5) post_edits (optional):
#        - term_merges / class_merges: add-only expansions.
#        - term_removals / class_removals: remove exact strings.
#        - term_set_splits: if coverage met, split into two named sets & drop source set.
#
# =============================================================================



# PREPROCESSING
preprocess:
  # Drop shorter aliases at the get go because these are noisy and need to be defined manually
  min_alias_length: 4 
  # now remove any of these aliases (but don't remove the associated term sets)
  aliases_to_remove: []
  # now remove any term set that contains any of these:
  term_sets_to_remove: [] 

