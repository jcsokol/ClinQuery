name: clinquery_gpu  # this environment supports all ClinQuery pipelines
channels:
  - nvidia            
  - conda-forge
dependencies:
  # Core
  - python=3.10
  - pip
  - numpy=1.26.*
  - pandas=2.2.*
  - duckdb=1.1.*
  - requests=2.*
  - rich=13.*
  - typing_extensions=4.*
  - tzdata
  - setuptools
  - wheel
  - pyarrow
  - optree=0.13.*
  - psycopg=3.*
  - streamlit
  - faiss-cpu
  - pyyaml
  - black
  - ruff
  - pytest
  - pre-commit

  # ingestion/analysis extras
  - scipy=1.12.*
  - scikit-learn=1.5.*
  - matplotlib=3.8.*
  - h5py=3.12.*
  - pillow=10.*
  - datasets

  # notebooks
  - jupyter
  - ipykernel
  - ipywidgets
  - jupyterlab_widgets
  - notebook

  # TensorFlow GPU 
  - tensorflow-gpu=2.18.*
  - tensorboard=2.18.*

  # PyTorch + CUDA 
  - pytorch
  - pytorch-cuda=12.6

  - pip:
      - rapidfuzz
      - sentence-transformers --no-deps   
      - openai
      - sqlparse
      - seqeval
      - tf-keras
      - transformers
      - accelerate